// ── 월별 통계 차트 ────────────────────────────
let statsY=new Date().getFullYear(), statsM=new Date().getMonth()+1;

function renderStats(){
  const lbl=$$('stats-lbl-btn');
  if(lbl)lbl.textContent=`${statsY}년 ${statsM}월`;

  const chart=$$('stats-chart');
  if(!chart)return;
  chart.innerHTML='';

  // 해당 월의 글 필터
  const mStr=`${statsY}-${String(statsM).padStart(2,'0')}`;
  const monthEntries=entries.filter(e=>e.date&&e.date.startsWith(mStr));

  // 상위 태그별 카운트
  const counts=TAGS.map(t=>{
    const allIds=[t.id,...(t.children||[]).map(c=>c.id)];
    const cnt=monthEntries.filter(e=>(e.tags||[]).some(tid=>allIds.includes(tid))).length;
    return{label:t.label,color:t.color,bg:t.bg,cnt};
  });

  const max=Math.max(...counts.map(r=>r.cnt),1);

  if(counts.every(r=>r.cnt===0)){
    chart.innerHTML=`<div class="stats-empty">이번 달 기록 없음</div>`;
    return;
  }

  counts.forEach(r=>{
    const pct=Math.round((r.cnt/max)*100);
    const row=document.createElement('div');
    row.className='stats-row';
    row.innerHTML=`
      <span class="stats-tag-name" title="${r.label}">${r.label.length>2?r.label.slice(0,2)+"…":r.label}</span>
      <div class="stats-bar-wrap">
        <div class="stats-bar" style="width:0%;background:${r.color}"></div>
      </div>
      <span class="stats-count">${r.cnt||''}</span>`;
    chart.appendChild(row);
    // 애니메이션: 다음 프레임에서 너비 적용
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const bar=row.querySelector('.stats-bar');
        if(bar)bar.style.width=pct+'%';
      });
    });
  });
}

// 년월 피커 이벤트
(function(){
  let pickerY=statsY;

  function buildMonthPicker(){
    const yl=$$('stats-yl');if(yl)yl.textContent=pickerY+'년';
    const ms=$$('stats-ms');if(!ms)return;
    ms.innerHTML='';
    for(let m=1;m<=12;m++){
      const btn=document.createElement('button');
      btn.className='ym-mb'+(pickerY===statsY&&m===statsM?' on':'');
      btn.textContent=m+'월';
      btn.onclick=()=>{
        statsY=pickerY;statsM=m;
        $$('stats-picker').classList.remove('open');
        renderStats();
      };
      ms.appendChild(btn);
    }
  }

  const lblBtn=$$('stats-lbl-btn');
  if(lblBtn)lblBtn.onclick=()=>{
    const picker=$$('stats-picker');
    if(!picker)return;
    const opening=!picker.classList.contains('open');
    picker.classList.toggle('open');
    if(opening){pickerY=statsY;buildMonthPicker();}
  };

  const prev=$$('stats-prev');
  if(prev)prev.onclick=()=>{
    statsM--;if(statsM<1){statsM=12;statsY--;}
    renderStats();
  };
  const next=$$('stats-next');
  if(next)next.onclick=()=>{
    statsM++;if(statsM>12){statsM=1;statsY++;}
    renderStats();
  };

  const py=$$('stats-py');if(py)py.onclick=()=>{pickerY--;buildMonthPicker()};
  const ny=$$('stats-ny');if(ny)ny.onclick=()=>{pickerY++;buildMonthPicker()};
})();

const BG_MIGRATE={
  '#EEEDFE':'#F0EAF8','#E1F5EE':'#E8F5EE','#FAECE7':'#F8F2EA',
  '#E6F1FB':'#E8F2F5','#EAF3FD':'#EAF0F8','#EAF3DE':'#F4F6E8',
  '#FAEEDA':'#F8F2EA','#FCEBEB':'#F8EAEA','#FBEAF0':'#F8EAEF',
  '#F3F1FE':'#F0EAF8','#F1EFE8':'#F2EAF8','#FAECEC':'#F8EAEA',
  '#F8EAF4':'#F8EAEF','#EFEFFA':'#F2EAF8','#E8F2F6':'#EAF0F8',
  '#E2F4EE':'#E8F5EE','#FAF0E3':'#F8F2EA','#E3F1FB':'#E8F2F5',
  '#E8F4DC':'#F4F6E8',
};
function migrateTagColors(tags){
  tags.forEach(t=>{
    if(COLOR_MIGRATE[t.color])t.color=COLOR_MIGRATE[t.color];
    if(BG_MIGRATE[t.bg])t.bg=BG_MIGRATE[t.bg];
    if(t.children)t.children.forEach(c=>{
      if(COLOR_MIGRATE[c.color])c.color=COLOR_MIGRATE[c.color];
      if(BG_MIGRATE[c.bg])c.bg=BG_MIGRATE[c.bg];
    });
  });
  return tags;
}

// 3) TAGS 변경 시 자동 저장 (편집 모드, 1초 debounce)
let _tagsTimer=null;
function saveTagsDebounced(){
  clearTimeout(_tagsTimer);
  _tagsTimer=setTimeout(()=>dbSaveTags(TAGS).catch(e=>console.warn('태그 저장 실패:',e)),1000);
}
const _origRenderTags=renderTags;
renderTags=function(){_origRenderTags();if(tagEditMode)saveTagsDebounced();};

// ── Firebase Auth ──────────────────────────────
const auth=getAuth(fbApp);
const provider=new GoogleAuthProvider();
let _dbUnsubscribe=null;

// 로그인 상태 영구 유지
setPersistence(auth, browserLocalPersistence).catch(()=>{});

$$('login-btn').onclick=()=>{
  signInWithPopup(auth,provider).catch(()=>{
    $$('login-err').style.display='block';
  });
};

onAuthStateChanged(auth,user=>{
  if(user){
    // 허용된 이메일만 접근 가능
    if(user.email!=='psa5386@gmail.com'){
      signOut(auth);
      $$('login-err').textContent='접근 권한이 없습니다.';
      $$('login-err').style.display='block';
      $$('login-screen').style.display='flex';
      $$('app').style.display='none';
      return;
    }
    // 로그인됨 — 앱 표시
    $$('login-screen').style.display='none';
    $$('app').style.display='flex';

    // 로그인 후 DB 초기화
    get(ref(db,'meta/tags')).then(snap=>{
      if(snap.exists()){
        try{
          TAGS=migrateTagColors(JSON.parse(snap.val()));
          dbSaveTags(TAGS);
          renderTags();
          renderMain();
        }catch(e){}
      }
    }).catch(e=>console.warn('태그 로드 실패:',e));

    if(_dbUnsubscribe)_dbUnsubscribe();
    _dbUnsubscribe=onValue(ref(db,'entries'),snap=>{
      const val=snap.val()||{};
      entries=Object.entries(val)
        .map(([key,data])=>({...data,key,id:key,tags:data.tags||[],media:data.media||[]}))
        .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      renderMain();
    },err=>console.error('DB 연결 오류:',err));

  } else {
    // 로그아웃 — DB 구독 해제
    if(_dbUnsubscribe){_dbUnsubscribe();_dbUnsubscribe=null;}
    entries=[];
    $$('login-screen').style.display='flex';
    $$('app').style.display='none';
  }
});

// ── Service Worker 등록 ───────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
