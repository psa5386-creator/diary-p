<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KNOW KNOW">
<meta name="theme-color" content="#7B77E9">
<link rel="manifest" href="manifest.json">
<title>KNOW KNOW</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ac:#7B77E9;--acl:#EFEFFD;--acm:#5753C9;
  --bp:#ffffff;--bs:#F7F7FC;--tp:#1E1E2E;--ts:#9090AA;
  --bd:rgba(120,120,180,.12);--bm:rgba(120,120,180,.22);
  --rm:14px;--rl:20px;--sw:270px;
}
html,body{height:100%;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;background:var(--bs);color:var(--tp);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
#ed-content,#e-title,input,textarea{-webkit-user-select:text!important;user-select:text!important}
#app{display:none;height:100vh;overflow:hidden}
/* SIDEBAR */
#sidebar{width:var(--sw);min-width:var(--sw);background:var(--bp);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
#sb-head{padding:28px 20px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;flex-wrap:wrap;gap:4px}
#sb-head h1{font-size:20px;font-weight:700;color:var(--tp);letter-spacing:-0.5px}
#sb-head p{font-size:12px;color:var(--ts);margin-top:3px;width:100%;font-weight:400}
#sb-close{display:none;background:none;border:none;cursor:pointer;color:var(--ts);font-size:22px;padding:4px;align-items:center;border-radius:var(--rm);margin-left:auto}
#sb-search{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;min-height:64px}
.si-w{position:relative;width:100%}
.si-w i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ts);pointer-events:none}
#search-input{width:100%;height:40px;border:none;border-radius:100px;background:var(--bs);padding:0 14px 0 38px;font-size:16px;color:var(--tp);outline:none;font-family:inherit}
#search-input:focus{box-shadow:0 0 0 2px var(--acl)}
#tag-sec{padding:16px 20px;overflow-y:auto;flex:1}
.sec-lbl{font-size:10px;font-weight:700;color:var(--ts);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.tmg-icon{background:none;border:none;cursor:pointer;color:var(--ts);font-size:15px;padding:0;display:flex;align-items:center}
.tag-list{display:flex;flex-direction:column;gap:2px}
.tag-item{display:flex;align-items:center;padding:7px 10px;border-radius:100px;cursor:pointer;font-size:13px;color:var(--tp);min-width:0;transition:background .15s}
.tag-item:hover{background:var(--bs)}
.tag-item.on{background:var(--acl);color:var(--acm)}
.tag-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:block}
.tag-cnt{font-size:11px;color:var(--ts);background:var(--bs);padding:2px 8px;border-radius:100px;white-space:nowrap;flex-shrink:0;font-weight:500}
.tag-item.on .tag-cnt{background:rgba(123,119,233,.15);color:var(--acm)}
.sub-tag{font-size:12px}
.tc{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tc-l{display:flex;align-items:center;flex-shrink:0}
.tag-col-grip{width:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tag-col-chevron{width:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tag-col-dot{width:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tag-col-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-item.edit-mode{}
.tag-add-row{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:100px;background:var(--bs);margin:2px 0}
.tag-add-row input{flex:1;border:none;outline:none;background:transparent;font-size:13px;color:var(--tp);font-family:inherit;min-width:0}
.tag-add-row input::placeholder{color:var(--ts)}
.tag-pal-dot{width:14px;height:14px;border-radius:50%;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:transform .1s}
.tag-pal-dot.sel{border-color:var(--ac);transform:scale(1.2)}
.tag-confirm-btn{background:none;border:none;cursor:pointer;color:var(--ac);font-size:16px;padding:2px;display:flex;align-items:center;flex-shrink:0}
.tag-item.dragging{opacity:.4;background:var(--acl)!important}
.tag-item.drag-over-top{border-top:2px solid var(--ac)}
.tag-item.drag-over-bottom{border-bottom:2px solid var(--ac)}
.tag-item.drag-over-child{outline:2px solid var(--ac);background:var(--acl)!important}
.drag-handle{cursor:grab;color:var(--ts);font-size:14px;padding:0 3px;display:flex;align-items:center;flex-shrink:0;opacity:.4}
.drag-handle:active{cursor:grabbing}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bs)}
#main-tb{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--bp);border-bottom:1px solid var(--bd)}
#main-title{font-size:17px;font-weight:700;color:var(--tp)}
.tb-r{display:flex;align-items:center;gap:8px}
.vtog{display:flex;background:var(--bs);border-radius:100px;padding:3px;gap:2px}
.vbtn{background:none;border:none;padding:5px 11px;cursor:pointer;font-size:16px;color:var(--ts);display:flex;align-items:center;border-radius:100px;transition:all .15s}
.vbtn.on{background:var(--bp);color:var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.compose-btn{display:flex;align-items:center;gap:6px;background:var(--ac);color:#fff;border:none;border-radius:100px;padding:7px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 10px rgba(123,119,233,.35)}
.compose-btn:active{background:var(--acm)}
/* LIST */
#list-view{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.ecard{background:var(--bp);border:none;border-radius:var(--rl);padding:18px 20px;cursor:pointer;box-shadow:0 2px 12px rgba(100,100,180,.07);transition:transform .15s}
.ecard:active{transform:scale(.99)}
.ec-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.ec-tit{font-size:15px;font-weight:600;color:var(--tp)}
.ec-dt{font-size:11px;color:var(--ts);white-space:nowrap;margin-left:8px}
.ec-prev{font-size:13px;color:var(--ts);line-height:1.55;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:400;font-style:normal;text-decoration:none}
.ec-prev *{font-size:inherit!important;color:inherit!important;font-weight:inherit!important;font-style:inherit!important;text-decoration:inherit!important;background:none!important;line-height:inherit!important}
.ec-tags{display:flex;flex-wrap:wrap;gap:5px}
.ec-tag{font-size:11px;padding:3px 10px;border-radius:100px;font-weight:600}
.ecard-sel{outline:2px solid var(--ac)!important;background:var(--acl)!important}
.no-entry{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ts);gap:10px}
.no-entry i{font-size:40px;opacity:.15}
/* GALLERY VIEW */
#gallery-view{flex:1;display:none;flex-direction:column;overflow:hidden;background:var(--bs)}
#gallery-filter-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bp);border-bottom:1px solid var(--bd);flex-shrink:0}
#gallery-filter-tag{font-size:13px;color:var(--ts);flex:1}
#gallery-scroll{flex:1;overflow-y:auto}
#gallery-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
  padding:2px;
}
.gallery-cell{
  aspect-ratio:1;
  background-size:cover;
  background-position:center;
  background-color:var(--bd);
  cursor:pointer;
  transition:opacity .15s;
}
.gallery-cell:active{opacity:.75}
#cal-view{flex:1;overflow:hidden;padding:16px;display:none;flex-direction:column}
.bc-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0}
.bc-nav{background:var(--bp);border:none;border-radius:100px;cursor:pointer;color:var(--ts);font-size:17px;padding:6px 10px;display:flex;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.bc-lbl-w{position:relative}
.bc-lbl{background:none;border:none;cursor:pointer;font-size:17px;font-weight:700;color:var(--tp);font-family:inherit;padding:4px 10px;border-radius:100px;display:flex;align-items:center;gap:6px}
.bc-lbl:hover{background:var(--acl)}
.bc-lbl .ti{font-size:12px;color:var(--ts)}
.bc-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto;border-radius:var(--rl);overflow:hidden;background:var(--bp);box-shadow:0 2px 12px rgba(100,100,180,.08);flex:1;align-content:stretch}
.bc-dn{text-align:center;font-size:11px;font-weight:700;color:var(--ts);padding:6px 0;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:center;}
.bc-cell{padding:6px 7px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);cursor:pointer;background:var(--bp);transition:background .1s}
.bc-cell:hover{background:var(--acl)}
.bc-cell:nth-child(7n+8){border-right:none}
.bc-num{font-size:12px;color:var(--ts);font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.bc-cell.today .bc-num{background:var(--ac);color:#fff}
.bc-cell.otm{background:var(--bs)}
.bc-cell.otm .bc-num{opacity:.25}
.bc-cell.hday .bc-num{color:#e03c3c}
.bc-cell.today.hday .bc-num{color:#fff}
.hd-lbl{font-size:9px;color:#e03c3c;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-chip{font-size:10px;color:var(--acm);background:var(--acl);border-radius:6px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bc-dots{display:flex;align-items:center;gap:3px;margin-top:4px;flex-wrap:nowrap}
.bc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.bc-dot-plus{font-size:9px;font-weight:700;color:var(--ts);line-height:1}
/* YM PICKER */
.ym-picker{position:absolute;z-index:400;background:var(--bp);border:none;border-radius:var(--rl);box-shadow:0 8px 32px rgba(100,100,180,.15);padding:16px;width:240px;display:none;top:42px;left:50%;transform:translateX(-50%)}
.ym-picker.open{display:block}
.ym-yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ym-ynav{background:var(--bs);border:none;border-radius:100px;cursor:pointer;color:var(--ts);font-size:16px;padding:4px 10px;display:flex;align-items:center}
.ym-ylbl{font-size:15px;font-weight:700;color:var(--tp)}
.ym-ms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ym-mb{background:none;border:none;border-radius:100px;padding:8px 4px;font-size:12px;font-weight:500;cursor:pointer;color:var(--tp);font-family:inherit;text-align:center;transition:background .15s}
.ym-mb:hover{background:var(--bs)}
.ym-mb.on{background:var(--ac);color:#fff}
.ym-mb.he{font-weight:700}
/* DAY LIST */
#day-list-view{flex:1;display:none;flex-direction:column;overflow:hidden}
#day-list-tb{display:flex;align-items:center;gap:8px;padding:14px 20px;background:var(--bp);border-bottom:1px solid var(--bd)}
#day-list-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bs)}
/* READ VIEW */
#read-view{flex:1;display:none;flex-direction:column;overflow:hidden}
#read-tb{display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--bp);border-bottom:1px solid var(--bd)}
#read-scroll{flex:1;overflow-y:auto;padding:0 24px 40px;background:var(--bp)}
#read-title{font-size:26px;font-weight:700;color:var(--tp);padding:24px 0 8px;line-height:1.3}
#read-body{font-size:16px;line-height:1.9;color:var(--tp);margin-top:16px;white-space:pre-wrap}
#read-body img{max-width:100%;border-radius:var(--rl);margin:10px 0;display:block}
#read-body video{max-width:100%;border-radius:var(--rl);margin:10px 0;display:block}
/* EDITOR */
#ed-view{flex:1;display:none;flex-direction:column;overflow:hidden;position:relative}
#ed-tb{background:var(--bp);border-bottom:1px solid var(--bd);flex-shrink:0}
.ed-row{display:flex;align-items:center;gap:6px;padding:10px 16px}
.ed-toolbar-row{
  display:flex;align-items:center;gap:4px;
  padding:6px 16px 8px;
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  border-top:1px solid var(--bd);
}
.ed-toolbar-row::-webkit-scrollbar{display:none}
.ed-tb-btn{
  background:none;border:none;
  border-radius:8px;
  padding:6px 8px;
  font-size:18px;
  cursor:pointer;color:var(--ts);
  display:flex;align-items:center;justify-content:center;
  line-height:1;flex-shrink:0;
  min-width:34px;height:34px;
  transition:background .1s,color .1s;
  font-family:inherit;
}
.ed-tb-btn:active{background:var(--bs)}
.ed-tb-btn.fmt-on{background:var(--acl);color:var(--acm)}
.ed-tb-sep{width:1px;height:22px;background:var(--bd);flex-shrink:0;margin:0 4px}
.ed-row-gap{flex:1}
.ed-btn{background:none;border:1px solid var(--bd);border-radius:100px;padding:5px 10px;font-size:15px;cursor:pointer;color:var(--ts);display:flex;align-items:center;line-height:1;font-family:inherit;transition:all .15s}
.ed-btn:hover{background:var(--bs);color:var(--tp)}
.ed-save{background:var(--ac);color:#fff;border:none;border-radius:100px;padding:7px 20px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;box-shadow:0 2px 8px rgba(123,119,233,.3)}
.ed-save:active{background:var(--acm)}

/* 플로팅 액션 바 (되돌리기 + 미디어) */
.ed-act-btn{
  background:var(--bp);
  border:1px solid var(--bd);
  border-radius:100px;
  padding:7px 12px;
  font-size:17px;
  cursor:pointer;
  color:var(--ts);
  display:flex;align-items:center;
  line-height:1;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  transition:all .15s;
  flex-shrink:0;
  pointer-events:auto;
}
.ed-act-btn:active{background:var(--bs);color:var(--ac)}

/* 하단 서식 바 — JS로 fixed 제어 */
#ed-format-bar{
  display:none;align-items:center;gap:6px;
  padding:8px 16px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  background:var(--bp);border-top:1px solid var(--bd);
  overflow-x:auto;overflow-y:hidden;
  flex-shrink:0;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:800;
}
#ed-format-bar.visible{display:flex}
#ed-format-bar::-webkit-scrollbar{display:none}

#ed-action-bar{
  position:fixed;
  bottom:52px;
  left:0;right:0;
  display:none;
  align-items:center;
  gap:10px;
  padding:8px 16px;
  background:transparent;
  z-index:801;
  pointer-events:none;
}
#ed-action-bar.visible{display:flex}
.ed-fmt-btn{
  background:none;border:1px solid var(--bd);border-radius:100px;
  padding:6px 10px;font-size:16px;cursor:pointer;color:var(--ts);
  display:flex;align-items:center;line-height:1;
  flex-shrink:0;font-family:inherit;transition:all .15s;
  min-width:36px;justify-content:center;
}
.ed-fmt-btn:active{background:var(--bs)}
.ed-fmt-btn.tiptap-active{background:var(--acl);color:var(--acm);border-color:var(--ac)}
.ed-fmt-sep{width:1px;height:22px;background:var(--bd);flex-shrink:0;margin:0 2px}
#ed-scroll{flex:1;overflow-y:auto;padding:0 24px 20px;background:var(--bp);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#e-title{display:block;width:100%;border:none;outline:none;font-size:24px;font-weight:700;color:var(--tp);background:transparent;padding:12px 0;font-family:inherit;caret-color:var(--ac);min-height:64px;box-sizing:border-box}
#e-title::placeholder{color:var(--bd)}
.meta-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin-bottom:20px;flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ts)}
.meta-date{border:none;outline:none;background:transparent;font-size:16px;color:var(--tp);font-family:inherit;cursor:pointer}
.tag-wrap{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.a-tag{font-size:11px;padding:3px 10px;border-radius:100px;font-weight:600;cursor:pointer}
.a-tag:hover{opacity:.75}
.tag-add-btn{background:var(--bs);border:none;border-radius:100px;padding:3px 10px;font-size:11px;color:var(--ts);cursor:pointer;display:flex;align-items:center;gap:3px;font-family:inherit}
.tag-add-btn:hover{background:var(--acl);color:var(--ac)}
#ed-body{display:flex;flex-direction:column}
#ed-content{width:100%;min-height:280px;border:none;outline:none;font-size:16px;line-height:1.9;color:var(--tp);background:transparent;resize:none;font-family:inherit;caret-color:var(--ac);white-space:pre-wrap}
#ed-content:empty::before{content:attr(data-placeholder);color:var(--ts);pointer-events:none;opacity:.6}
.m-block{border:none;border-radius:var(--rl);overflow:hidden;margin:12px 0;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.yt-block{margin:12px 0;position:relative;border-radius:var(--rl);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.yt-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.m-block img,.m-block video{width:100%;display:block;max-height:280px;object-fit:cover}
.m-rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}



.lp{display:block;border:none;border-radius:var(--rl);overflow:hidden;margin:12px 0;background:var(--bs);position:relative;cursor:pointer;text-decoration:none;box-shadow:0 2px 10px rgba(100,100,180,.08);transition:opacity .15s}
.lp:hover{opacity:.85}
.lp-img{width:100%;max-height:180px;object-fit:cover;display:block}
.lp-body{padding:12px 14px}
.lp-dom{font-size:11px;color:var(--ts);margin-bottom:4px;display:flex;align-items:center}
.lp-tit{font-size:13px;font-weight:600;color:var(--tp);line-height:1.4;margin-bottom:3px}
.lp-desc{font-size:12px;color:var(--ts);line-height:1.5;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lp-url{font-size:11px;color:var(--ac);word-break:break-all;opacity:.8}
.lp-rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:1}
/* 로딩 애니메이션 */
.lp-loading{display:flex;align-items:center;justify-content:center;gap:6px;padding:20px}
.lp-dot{width:7px;height:7px;border-radius:50%;background:var(--bm);animation:lp-bounce .9s ease-in-out infinite}
.lp-dot:nth-child(2){animation-delay:.15s}
.lp-dot:nth-child(3){animation-delay:.3s}
@keyframes lp-bounce{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1);opacity:1}}
/* MODALS */
.modal-ov{position:fixed;inset:0;background:rgba(30,30,60,.3);display:none;align-items:center;justify-content:center;z-index:600;backdrop-filter:blur(6px)}
.modal-ov.show{display:flex}
.modal{background:var(--bp);border-radius:var(--rl);border:none;padding:24px;width:340px;box-shadow:0 16px 48px rgba(100,100,180,.18)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--tp)}
.modal input{width:100%;height:42px;border:1px solid var(--bd);border-radius:100px;padding:0 16px;font-size:16px;color:var(--tp);background:var(--bs);font-family:inherit;outline:none;margin-bottom:10px}
.modal input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acl)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.btn-c{background:var(--bs);border:none;border-radius:100px;padding:8px 18px;font-size:13px;cursor:pointer;color:var(--ts);font-family:inherit;font-weight:500}
.btn-ok{background:var(--ac);border:none;border-radius:100px;padding:8px 18px;font-size:13px;cursor:pointer;color:#fff;font-weight:600;font-family:inherit;box-shadow:0 2px 8px rgba(123,119,233,.3)}
.btn-ok:active{background:var(--acm)}
.tp-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tp-btn{font-size:12px;padding:5px 14px;border-radius:100px;cursor:pointer;border:1.5px solid var(--bd);background:var(--bs);color:var(--tp);font-weight:500;font-family:inherit;transition:all .15s}
.tp-btn:hover{border-color:var(--ac)}
.tp-btn.on{border-color:transparent;font-weight:600}
/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}

#ed-content{width:100%;min-height:300px;border:none;outline:none;font-size:16px;line-height:1.9;color:var(--tp);background:transparent;font-family:inherit;caret-color:var(--ac)}
#ed-content:empty::before{content:attr(data-placeholder);color:var(--ts);pointer-events:none;opacity:.6;display:block}
#ed-content h1{font-size:24px;font-weight:700;margin:.6em 0 .3em;line-height:1.3}
#ed-content h2{font-size:20px;font-weight:700;margin:.6em 0 .3em;line-height:1.3}
#ed-content ul,#ed-content ol{padding-left:1.5em;margin:.4em 0}
#ed-content li{margin:.2em 0}
#ed-content blockquote{border-left:3px solid var(--ac);padding-left:1em;margin:.6em 0;color:var(--ts);font-style:italic}
#ed-content a{color:var(--ac);text-decoration:underline}
#ed-content mark{background:#FFF176;border-radius:3px;padding:0 2px}
.tiptap-read-body{font-size:16px;line-height:1.9;color:var(--tp)}
.tiptap-read-body img{max-width:100%;border-radius:var(--rl);margin:10px 0;display:block;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.tiptap-read-body p{margin:0 0 .4em}
.tiptap-read-body h1{font-size:24px;font-weight:700;margin:.8em 0 .3em;line-height:1.3}
.tiptap-read-body h2{font-size:20px;font-weight:700;margin:.8em 0 .3em;line-height:1.3}
.tiptap-read-body ul,.tiptap-read-body ol{padding-left:1.5em;margin:.4em 0}
.tiptap-read-body li{margin:.2em 0}
.tiptap-read-body blockquote{border-left:3px solid var(--ac);padding-left:1em;margin:.6em 0;color:var(--ts);font-style:italic}
.tiptap-read-body a{color:var(--ac);text-decoration:underline}
.tiptap-read-body mark{background:#FFF176;border-radius:3px;padding:0 2px}
.tiptap-read-body strong{font-weight:700}
.tiptap-read-body em{font-style:italic}
.tiptap-active{background:var(--acl)!important;color:var(--acm)!important}

/* MOBILE */
#mob-hdr{display:none}
#mob-tb{display:none}
#fab-compose{display:none}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(30,30,60,.3);z-index:499}
#sb-close{display:none;background:none;border:none;cursor:pointer;color:var(--ts);font-size:22px;padding:4px;align-items:center;border-radius:100px;margin-left:auto}
#mob-sw{display:none}
input[type="file"]{display:none}

@media(max-width:768px){
  #app{flex-direction:column;height:100dvh}
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:360px;height:100%;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:500;border-right:none;box-shadow:4px 0 24px rgba(0,0,0,.18)}
  #sidebar.open{transform:translateX(0)}
  #sb-overlay.open{display:block}
  #sb-close{display:flex}
  #main{flex:1;overflow:hidden;display:flex;flex-direction:column}
  #mob-hdr{display:flex;align-items:center;padding:0 16px;background:var(--bp);border-bottom:1px solid var(--bd);min-height:52px;flex-shrink:0;position:relative}
  #mob-hdr-t{font-size:17px;font-weight:700;color:var(--tp)}
  .mib{background:none;border:none;cursor:pointer;color:var(--ts);font-size:22px;padding:4px;display:flex;align-items:center;border-radius:100px}
  #mob-hdr-r{display:flex;align-items:center;margin-left:auto}
  #main-tb{display:none}
  #mob-sw{display:block;padding:10px 18px;background:var(--bp);border-bottom:1px solid var(--bd);position:relative;flex-shrink:0}
  #mob-si{width:100%;height:40px;border:none;border-radius:100px;background:var(--bs);padding:0 14px 0 38px;font-size:16px;color:var(--tp);outline:none;font-family:inherit}
  .mob-si-ic{position:absolute;left:32px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ts);pointer-events:none}
  #mob-tb{display:none!important}
  /* FAB 글쓰기 버튼 */
  #fab-compose{
    display:flex;position:fixed;
    right:20px;bottom:calc(8px + env(safe-area-inset-bottom));
    width:56px;height:56px;border-radius:50%;
    background:var(--ac);color:#fff;border:none;cursor:pointer;
    align-items:center;justify-content:center;
    font-size:24px;
    box-shadow:0 4px 20px rgba(123,119,233,.5);
    z-index:200;transition:transform .15s,box-shadow .15s;
  }
  #fab-compose:active{transform:scale(.92);box-shadow:0 2px 10px rgba(123,119,233,.4)}
  /* 헤더 타이틀 중앙 */
  .mob-hdr-title{
    position:absolute;left:50%;transform:translateX(-50%);
    font-size:16px;font-weight:700;color:var(--tp);
    white-space:nowrap;pointer-events:none;
  }
  /* 뷰 전환 토글 */
  .mvt{display:flex;background:var(--bs);border-radius:100px;padding:3px;gap:2px}
  .mvb{background:none;border:none;padding:5px 10px;cursor:pointer;font-size:15px;color:var(--ts);display:flex;align-items:center;border-radius:100px;transition:all .15s}
  .mvb.on{background:var(--bp);color:var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.1)}
  #list-view{padding:12px}
  #cal-view{padding:8px}
  .bc-cell{padding:5px 5px}
  .bc-dn{padding:8px 0;font-size:10px}
  .e-chip{display:none}
  .bc-cell.mob-dot::after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--ac);margin:3px auto 0}
  .hd-lbl{font-size:8px}
  #ed-scroll{padding:0 16px 16px}
  #e-title{font-size:21px;padding:16px 0 8px}
  .ed-row{padding:8px 12px;gap:5px}
  .ed-fmt-btn{padding:5px 9px;font-size:15px}
  .modal{width:calc(100vw - 32px);max-width:400px}
  .ym-picker{width:220px!important}
  #read-scroll{padding:0 18px 32px}
  #read-title{font-size:22px;padding:18px 0 8px}
}
@media(min-width:769px){
  #mob-hdr{display:none!important}
  #mob-tb{display:none!important}
  #sb-overlay{display:none!important}
  #sb-close{display:none!important}
  #mob-sw{display:none!important}
  #sidebar{transform:none!important}
}

/* 월별 통계 차트 */
#stats-sec{padding:14px 20px 10px;border-bottom:1px solid var(--bd)}
#stats-header{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;margin-bottom:10px}
.stats-nav{background:none;border:none;cursor:pointer;color:var(--ts);font-size:16px;padding:4px 6px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .15s;width:30px;min-width:30px;flex-shrink:0}
.stats-nav:hover{background:var(--bs)}
.stats-lbl{background:none;border:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--tp);font-family:inherit;padding:3px 8px;border-radius:100px;text-align:center;width:100%}
.stats-lbl:hover{background:var(--bs)}
#stats-picker{display:none;background:var(--bp);border:1px solid var(--bd);border-radius:var(--rl);padding:12px;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
#stats-picker.open{display:block}
.stats-yr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#stats-chart{display:flex;flex-direction:column;gap:8px;min-height:20px}
.stats-row{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;gap:8px}
.stats-tag-name{font-size:11px;color:var(--ts);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:30px}
.stats-bar-wrap{background:var(--bs);border-radius:100px;height:10px;overflow:hidden}
.stats-bar{height:100%;border-radius:100px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.stats-count{font-size:11px;color:var(--ts);width:24px;text-align:left;font-weight:600;white-space:nowrap}
.stats-empty{font-size:11px;color:var(--ts);text-align:center;padding:6px 0;opacity:.5}
</style>
</head>
<body>

<div id="sb-overlay"></div>

<!-- 로그인 화면 -->

<div id="app">

function fd(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function tds(){return fd(T)}
function fs(s){return new Date(s+'T00:00:00').toLocaleDateString('ko-KR',{month:'short',day:'numeric'})}
function $$(id){return document.getElementById(id)}
function getTag(id){
  for(const t of TAGS){
    if(t.id===id)return t;
    if(t.children){const c=t.children.find(c=>c.id===id);if(c)return c;}
  }
  return null;
}
// 상위태그 색상 반환 (하위태그는 부모 색상 사용)
function getTagColor(id){
  for(const t of TAGS){
    if(t.id===id)return{color:t.color,bg:t.bg};
    if(t.children&&t.children.find(c=>c.id===id))return{color:t.color,bg:t.bg};
  }
  return{color:'#888780',bg:'#f1efe8'};
}
// 태그 부모 찾기
function getParentTag(id){
  for(const t of TAGS){if(t.children&&t.children.find(c=>c.id===id))return t;}
  return null;
}
function flatTags(){
  const r=[];
  TAGS.forEach(t=>{r.push(t);if(t.children)t.children.forEach(c=>r.push(c))});
  return r;
}
function isMob(){return window.innerWidth<=768}
function stripHtml(html){const d=document.createElement('div');d.innerHTML=html;return d.textContent||d.innerText||'';}
function isURL(s){try{const u=new URL(s);return u.protocol==='http:'||u.protocol==='https:'}catch{return false}}

// ── HOLIDAYS ──────────────────────────────────
const HC={},HF=new Set();
const HKO={"New Year's Day":'신정',"Lunar New Year's Eve":'설날 연휴',"Lunar New Year":'설날',"Lunar New Year Holiday":'설날 연휴','Independence Movement Day':'삼일절',"Children's Day":'어린이날',"Buddha's Birthday":'부처님오신날','Memorial Day':'현충일','Constitution Day':'제헌절','Liberation Day':'광복절','Chuseok Eve':'추석 연휴','Chuseok':'추석','Chuseok Holiday':'추석 연휴','National Foundation Day':'개천절','Hangul Day':'한글날','Christmas Day':'크리스마스','Substitute Holiday':'대체공휴일'};
function toKo(n){return HKO[n]||n}
function getH(ds){const y=ds.slice(0,4);return HC[y]?.[ds]||null}
async function fetchH(y){
  if(HC[y]||HF.has(y))return;HF.add(y);
  try{const r=await fetch('https://date.nager.at/api/v3/PublicHolidays/'+y+'/KR',{cache:'force-cache'});const m={};if(r.ok)(await r.json()).forEach(h=>{m[h.date]=toKo(h.localName||h.name)});HC[y]=m}
  catch(e){HC[y]={}}finally{HF.delete(y)}
}
async function ensureH(...ys){
  const n=[...new Set(ys)].filter(y=>!HC[y]);
  if(!n.length)return;
  await Promise.all(n.map(fetchH));
  if(curView==='cal')renderBC();
}

function setView(v){

// ── SIDEBAR TAGS ──────────────────────────────
// 펼쳐진 부모 태그 set
const expandedTags=new Set();
function entryCount(id){
  const t=TAGS.find(x=>x.id===id);
  const allIds=t?[id,...(t.children||[]).map(c=>c.id)]:[id];
  return entries.filter(e=>(e.tags||[]).some(tid=>allIds.includes(tid))).length;
}

// 인라인 색상 팔레트 렌더
function makePalHtml(selIdx,prefix){
  return TPAL.map((p,i)=>`<span class="tag-pal-dot${i===selIdx?' sel':''}" data-pal="${prefix}_${i}" style="background:${p.color}"></span>`).join('');
}

// 인라인 추가 폼 row HTML
function makeAddFormHtml(scope, ti, ci){
  // scope: 'root' | 'child'
  const prefix=scope==='root'?`root`:`child_${ti}`;
  return `<div class="tag-add-row" data-add-scope="${scope}" data-add-ti="${ti!=null?ti:''}" data-add-ci="${ci!=null?ci:''}">
    <input class="tag-add-inp" placeholder="태그 이름..." style="font-size:13px">
    <div class="tag-add-pal" data-pal-prefix="${prefix}" style="display:flex;gap:3px;flex-shrink:0">${makePalHtml(0,prefix)}</div>
    <button class="tag-confirm-btn tag-add-ok" title="완료"><i class="ti ti-check"></i></button>
    <button class="tag-confirm-btn" style="color:var(--ts)" onclick="this.closest('.tag-add-row').remove()" title="취소"><i class="ti ti-x"></i></button>
  </div>`;
}

// 드래그 상태
let dragSrc=null; // {type:'root'|'child', ti, ci}

function renderTags(){
  const w=$$('tag-list');
  const frag=document.createDocumentFragment();

  // 전체 row
  const allRow=document.createElement('div');
  allRow.className='tag-item'+(actTag?'':' on');
  allRow.dataset.id='';
  if(tagEditMode){
    allRow.innerHTML=
      `<span class="tag-col-grip"></span>`
      +`<span class="tag-col-chevron"></span>`
      +`<span class="tag-col-dot"><span class="tag-dot" style="background:#888780"></span></span>`
      +`<span class="tag-col-label">전체</span>`
      +`<span style="width:52px;flex-shrink:0"></span>`;
  } else {
    allRow.innerHTML=
      `<span class="tag-col-chevron"></span>`
      +`<span class="tag-col-dot"><span class="tag-dot" style="background:#888780"></span></span>`
      +`<span class="tag-col-label">전체</span>`
      +`<span class="tag-cnt">${entries.length}</span>`;
  }
  allRow.onclick=()=>{actTag=null;$$('main-title').textContent='전체';$$('mob-hdr-t').textContent='전체';if(isMob())closeSB();setView('list')};
  frag.appendChild(allRow);

  TAGS.forEach((t,ti)=>{
    const hasChildren=t.children&&t.children.length>0;
    const isExp=expandedTags.has(t.id);
    const cnt=entryCount(t.id);

    // 부모 row
    const row=document.createElement('div');
    row.className='tag-item'+(actTag===t.id?' on':'');
    row.dataset.id=t.id; row.dataset.ti=ti; row.dataset.type='root';
    row.draggable=tagEditMode;

    const chevBtn=(hasChildren||tagEditMode)
      ?`<button class="tag-expand" data-pid="${t.id}" style="background:none;border:none;cursor:pointer;color:var(--ts);font-size:12px;padding:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center"><i class="ti ti-chevron-${isExp?'down':'right'}"></i></button>`
      :``;

    if(tagEditMode){
      row.innerHTML=
        `<span class="tag-col-grip drag-handle"><i class="ti ti-grip-vertical"></i></span>`
        +`<span class="tag-col-chevron">${chevBtn}</span>`
        +`<span class="tag-col-dot"><span class="tag-dot" style="background:${t.color}"></span></span>`
        +`<span class="tag-col-label">${t.label}</span>`
        +`<button class="tag-ie" data-ti="${ti}" style="background:none;border:none;cursor:pointer;color:var(--ts);font-size:13px;padding:2px 4px;display:flex;align-items:center;flex-shrink:0"><i class="ti ti-pencil"></i></button>`
        +`<button class="tag-id" data-ti="${ti}" style="background:none;border:none;cursor:pointer;color:#e03c3c;font-size:13px;padding:2px 4px;display:flex;align-items:center;flex-shrink:0"><i class="ti ti-trash"></i></button>`;
    } else {
      row.innerHTML=
        `<span class="tag-col-chevron">${chevBtn}</span>`
        +`<span class="tag-col-dot"><span class="tag-dot" style="background:${t.color}"></span></span>`
        +`<span class="tag-col-label">${t.label}</span>`
        +`<span class="tag-cnt">${cnt}</span>`;
    }

    // 드래그 이벤트 (root)
    if(tagEditMode){
      row.addEventListener('dragstart',e=>{
        dragSrc={type:'root',id:t.id};
        e.dataTransfer.setData('text/plain',t.id);
        e.dataTransfer.effectAllowed='move';
        setTimeout(()=>row.classList.add('dragging'),0);
      });
      row.addEventListener('dragend',()=>{
        row.classList.remove('dragging');
        document.querySelectorAll('.drag-over-top,.drag-over-bottom,.drag-over-child').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom','drag-over-child'));
        dragSrc=null;
      });
      row.addEventListener('dragover',e=>{
        e.preventDefault();
        if(!dragSrc||dragSrc.id===t.id)return;
        document.querySelectorAll('.drag-over-top,.drag-over-bottom,.drag-over-child').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom','drag-over-child'));
        const rect=row.getBoundingClientRect(),y=e.clientY-rect.top;
        if(y<rect.height*0.3)row.classList.add('drag-over-top');
        else if(y>rect.height*0.7)row.classList.add('drag-over-bottom');
        else row.classList.add('drag-over-child');
      });
      row.addEventListener('dragleave',()=>{
        row.classList.remove('drag-over-top','drag-over-bottom','drag-over-child');
      });
      row.addEventListener('drop',e=>{
        e.preventDefault();
        row.classList.remove('drag-over-top','drag-over-bottom','drag-over-child');
        if(!dragSrc)return;
        const src={...dragSrc};dragSrc=null;
        const rect=row.getBoundingClientRect(),y=e.clientY-rect.top;
        const zone=y<rect.height*0.3?'top':y>rect.height*0.7?'bottom':'mid';
        const destId=t.id;

        if(src.type==='root'){
          const srcIdx=TAGS.findIndex(x=>x.id===src.id);
          if(srcIdx<0)return;
          const [srcTag]=TAGS.splice(srcIdx,1);
          // splice 후 다시 destIdx 계산
          const destIdx=TAGS.findIndex(x=>x.id===destId);
          if(destIdx<0){TAGS.push(srcTag);} // destId도 사라진 경우(자기 자신) 방어
          else if(zone==='top')TAGS.splice(destIdx,0,srcTag);
          else if(zone==='bottom')TAGS.splice(destIdx+1,0,srcTag);
          else{
            if(!TAGS[destIdx].children)TAGS[destIdx].children=[];
            TAGS[destIdx].children.push({id:srcTag.id,label:srcTag.label,color:srcTag.color,bg:srcTag.bg});
            expandedTags.add(destId);
          }
        } else if(src.type==='child'){
          const srcPi=TAGS.findIndex(x=>x.id===src.parentId);
          if(srcPi<0)return;
          const srcCi=TAGS[srcPi].children.findIndex(x=>x.id===src.id);
          if(srcCi<0)return;
          const [srcTag]=TAGS[srcPi].children.splice(srcCi,1);
          const destIdx=TAGS.findIndex(x=>x.id===destId);
          if(destIdx<0)return;
          const rootTag={id:srcTag.id,label:srcTag.label,color:srcTag.color,bg:srcTag.bg,children:[]};
          if(zone==='top')TAGS.splice(destIdx,0,rootTag);
          else if(zone==='bottom')TAGS.splice(destIdx+1,0,rootTag);
          else{
            if(!TAGS[destIdx].children)TAGS[destIdx].children=[];
            TAGS[destIdx].children.push({id:srcTag.id,label:srcTag.label,color:srcTag.color,bg:srcTag.bg});
            expandedTags.add(destId);
          }
        }
        renderTags();renderMain();
      });
    }

    frag.appendChild(row);

    // 자식 rows — 편집 모드에서는 항상 펼침
    if((isExp || tagEditMode) && hasChildren){
      t.children.forEach((c,ci)=>{
        const cc=entryCount(c.id);
        const crow=document.createElement('div');
        crow.className='tag-item sub-tag'+(actTag===c.id?' on':'');
        crow.dataset.id=c.id; crow.dataset.ti=ti; crow.dataset.ci=ci; crow.dataset.type='child';
        crow.draggable=tagEditMode;

        if(tagEditMode){
          crow.innerHTML=
            `<span class="tag-col-grip drag-handle"><i class="ti ti-grip-vertical"></i></span>`
            +`<span class="tag-col-chevron"></span>`
            +`<span class="tag-col-dot"><i class="ti ti-corner-down-right" style="font-size:11px;color:var(--ts)"></i></span>`
            +`<span class="tag-col-label">${c.label}</span>`
            +`<button class="tag-ie-c" data-ti="${ti}" data-ci="${ci}" style="background:none;border:none;cursor:pointer;color:var(--ts);font-size:13px;padding:2px 4px;display:flex;align-items:center;flex-shrink:0"><i class="ti ti-pencil"></i></button>`
            +`<button class="tag-id-c" data-ti="${ti}" data-ci="${ci}" style="background:none;border:none;cursor:pointer;color:#e03c3c;font-size:13px;padding:2px 4px;display:flex;align-items:center;flex-shrink:0"><i class="ti ti-trash"></i></button>`;
        } else {
          crow.innerHTML=
            `<span class="tag-col-chevron"></span>`
            +`<span class="tag-col-dot"><i class="ti ti-corner-down-right" style="font-size:11px;color:var(--ts)"></i></span>`
            +`<span class="tag-col-label">${c.label}</span>`
            +`<span class="tag-cnt">${cc}</span>`;
        }

        if(tagEditMode){
          crow.addEventListener('dragstart',e=>{
            dragSrc={type:'child',id:c.id,parentId:t.id};
            e.dataTransfer.setData('text/plain',c.id);
            e.dataTransfer.effectAllowed='move';
            setTimeout(()=>crow.classList.add('dragging'),0);
          });
          crow.addEventListener('dragend',()=>{
            crow.classList.remove('dragging');
            document.querySelectorAll('.drag-over-top,.drag-over-bottom,.drag-over-child').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom','drag-over-child'));
            dragSrc=null;
          });
          crow.addEventListener('dragover',e=>{
            e.preventDefault();
            if(!dragSrc||dragSrc.id===c.id)return;
            document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom'));
            const rect=crow.getBoundingClientRect(),y=e.clientY-rect.top;
            crow.classList.add(y<rect.height/2?'drag-over-top':'drag-over-bottom');
          });
          crow.addEventListener('dragleave',()=>{
            crow.classList.remove('drag-over-top','drag-over-bottom');
          });
          crow.addEventListener('drop',e=>{
            e.preventDefault();
            crow.classList.remove('drag-over-top','drag-over-bottom');
            if(!dragSrc)return;
            const src={...dragSrc};dragSrc=null;
            const insertBefore=e.clientY-crow.getBoundingClientRect().top < crow.getBoundingClientRect().height/2;

            if(src.type==='child'){
              const srcPi=TAGS.findIndex(x=>x.id===src.parentId);
              if(srcPi<0)return;
              const srcCi=TAGS[srcPi].children.findIndex(x=>x.id===src.id);
              if(srcCi<0)return;
              const [srcTag]=TAGS[srcPi].children.splice(srcCi,1);
              // splice 후 재계산
              const curDestPi=TAGS.findIndex(x=>x.id===t.id);
              if(curDestPi<0){TAGS[srcPi].children.push(srcTag);} // 방어
              else{
                const curDestCi=TAGS[curDestPi].children.findIndex(x=>x.id===c.id);
                if(curDestCi<0)TAGS[curDestPi].children.push(srcTag);
                else if(insertBefore)TAGS[curDestPi].children.splice(curDestCi,0,srcTag);
                else TAGS[curDestPi].children.splice(curDestCi+1,0,srcTag);
              }
            } else if(src.type==='root'){
              const srcPi=TAGS.findIndex(x=>x.id===src.id);
              if(srcPi<0)return;
              const [srcTag]=TAGS.splice(srcPi,1);
              const curDestPi=TAGS.findIndex(x=>x.id===t.id);
              if(curDestPi<0)return;
              if(!TAGS[curDestPi].children)TAGS[curDestPi].children=[];
              const curDestCi=TAGS[curDestPi].children.findIndex(x=>x.id===c.id);
              const child={id:srcTag.id,label:srcTag.label,color:srcTag.color,bg:srcTag.bg};
              if(curDestCi<0)TAGS[curDestPi].children.push(child);
              else if(insertBefore)TAGS[curDestPi].children.splice(curDestCi,0,child);
              else TAGS[curDestPi].children.splice(curDestCi+1,0,child);
              expandedTags.add(t.id);
            }
            renderTags();renderMain();
          });
        }
        frag.appendChild(crow);
      });
    }

    // 편집 모드: 하위태그 추가 버튼 (펼침 여부와 무관하게 항상 표시)
    if(tagEditMode){
      const addChildPlus=document.createElement('div');
      // 들여쓰기: grip(20) + chevron(20) + dot(20) = 60px → 하위태그 ↳ 아이콘 위치
      addChildPlus.style.cssText='padding:3px 8px 3px 68px';
      addChildPlus.innerHTML=`<button class="tag-plus-btn" data-ti="${ti}" data-type="child" style="background:none;border:1px dashed var(--bm);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--ts);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;width:100%;justify-content:center"><i class="ti ti-plus" style="font-size:12px"></i> 하위태그</button>`;
      frag.appendChild(addChildPlus);
    }

    // 펼쳐져 있지 않을 때도 편집 모드면 하위 추가 버튼(펼침 후 표시)은 row에 있음
  });

  // 편집 모드: 최상위 태그 추가 버튼
  if(tagEditMode){
    const rootPlus=document.createElement('div');
    rootPlus.style.cssText='padding:3px 8px 3px 8px';
    rootPlus.innerHTML=`<button class="tag-plus-btn" data-ti="" data-type="root" style="background:none;border:1px dashed var(--bm);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--ts);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;width:100%;justify-content:center"><i class="ti ti-plus" style="font-size:12px"></i> 최상위 태그 추가</button>`;
    frag.appendChild(rootPlus);
  }

  w.innerHTML='';
  w.appendChild(frag);

  // ── 이벤트 바인딩 ──────────────────────────

  // 펼치기
  w.querySelectorAll('.tag-expand').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const pid=btn.dataset.pid;
    if(expandedTags.has(pid))expandedTags.delete(pid);else expandedTags.add(pid);
    renderTags();
  });

  // + 버튼 → 인라인 추가 폼 삽입
  w.querySelectorAll('.tag-plus-btn').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const type=btn.dataset.type;
    const ti=btn.dataset.ti!==''?parseInt(btn.dataset.ti):null;

    // 같은 위치에 이미 폼 있으면 제거
    const existing=w.querySelector('.tag-add-row');
    if(existing)existing.remove();

    // 폼 row 생성
    const formDiv=document.createElement('div');
    formDiv.className='tag-add-row';
    if(type==='child'){
      formDiv.style.cssText='margin:3px 8px 3px 68px;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:100px;background:var(--bs)';
    } else {
      formDiv.style.cssText='margin:3px 8px;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:100px;background:var(--bs)';
    }

    let selPalI=0;
    function buildForm(){
      const palHtml=type==='root'
        ?`<div class="tag-add-pal" style="display:flex;gap:3px;flex-shrink:0">`
          +TPAL.map((p,i)=>`<span class="tag-pal-dot${i===selPalI?' sel':''}" data-i="${i}" style="background:${p.color}"></span>`).join('')
          +`</div>`
        :''; // 하위태그는 팔레트 없음 (상위 색상 사용)
      formDiv.innerHTML=
        `<input class="tag-add-inp" placeholder="태그 이름..." style="flex:1;min-width:0;font-size:13px;border:none;outline:none;background:transparent;color:var(--tp);font-family:inherit">`
        +palHtml
        +`<button class="tag-confirm-btn ok-btn" title="완료"><i class="ti ti-check"></i></button>`
        +`<button class="tag-confirm-btn" style="color:var(--ts)" title="취소"><i class="ti ti-x"></i></button>`;

      formDiv.querySelectorAll('.tag-pal-dot').forEach(dot=>dot.onclick=ev=>{
        ev.stopPropagation();
        const savedVal=formDiv.querySelector('.tag-add-inp').value;
        selPalI=parseInt(dot.dataset.i);
        buildForm();
        const newInp=formDiv.querySelector('.tag-add-inp');
        newInp.value=savedVal;
        newInp.focus();
      });

      const inp=formDiv.querySelector('.tag-add-inp');

      formDiv.querySelector('.ok-btn').onclick=ev=>{
        ev.stopPropagation();
        const name=inp.value.trim();
        if(!name)return;
        const p=TPAL[selPalI];
        const newTag={id:newTagId(),label:name,color:p.color,bg:p.bg};
        if(type==='root'){
          TAGS.push({...newTag,children:[]});
        } else {
          if(!TAGS[ti].children)TAGS[ti].children=[];
          TAGS[ti].children.push(newTag);
          expandedTags.add(TAGS[ti].id);
        }
        formDiv.remove();
        renderTags();renderMain();
      };

      formDiv.querySelectorAll('.tag-confirm-btn')[1].onclick=ev=>{ev.stopPropagation();formDiv.remove()};
      inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();formDiv.querySelector('.ok-btn').click()}else if(ev.key==='Escape')formDiv.remove()};
      inp.focus();
    }
    buildForm();

    // 삽입 위치: type===root → 리스트 끝, type===child → 해당 부모 다음 자식 마지막 뒤
    if(type==='root'){
      w.appendChild(formDiv);
    } else {
      // row 다음에 삽입 (자식 마지막 뒤)
      const parentRow=w.querySelector(`.tag-item[data-ti="${ti}"][data-type="root"]`);
      // 자식들 중 마지막 것 찾기
      const children=[...w.querySelectorAll(`.tag-item[data-ti="${ti}"][data-type="child"]`)];
      const lastChild=children[children.length-1];
      // 하위태그 추가 버튼 div도 고려
      const childPlusDiv=w.querySelector(`button[data-ti="${ti}"][data-type="child"]`)?.closest('div:not(.tag-add-row)');
      const insertAfter=childPlusDiv||lastChild||parentRow;
      if(insertAfter&&insertAfter.nextSibling)w.insertBefore(formDiv,insertAfter.nextSibling);
      else w.appendChild(formDiv);
    }
  });

  // 이름 수정 (부모)
  w.querySelectorAll('.tag-ie').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const ti=parseInt(btn.dataset.ti),t=TAGS[ti];
    const row=btn.closest('.tag-item');
    const lbl=row.querySelector('.tag-col-label');
    if(!lbl)return;

    let selColor=t.color,selBg=t.bg;
    function buildEdit(){
      lbl.innerHTML=`<div style="display:flex;flex-direction:column;gap:4px;width:100%">
        <input class="tag-edit-inp" value="${t.label}" style="border:none;outline:none;background:transparent;font-size:13px;color:var(--tp);font-family:inherit;width:100%">
        <div style="display:flex;gap:3px;flex-wrap:wrap">
          ${TPAL.map((p,i)=>`<button class="tag-pal-pick" data-i="${i}" style="width:16px;height:16px;border-radius:50%;background:${p.color};border:${p.color===selColor?'2px solid var(--ac)':'1.5px solid transparent'};cursor:pointer;padding:0;flex-shrink:0"></button>`).join('')}
        </div>
      </div>`;
      const inp=lbl.querySelector('.tag-edit-inp');
      lbl.querySelectorAll('.tag-pal-pick').forEach(pb=>pb.onclick=ev=>{
        ev.stopPropagation();ev.preventDefault();
        const p=TPAL[parseInt(pb.dataset.i)];
        selColor=p.color;selBg=p.bg;
        buildEdit();
        lbl.querySelector('.tag-edit-inp').focus();
      });
      const save=()=>{
        const nl=inp.value.trim();
        if(nl)TAGS[ti].label=nl;
        TAGS[ti].color=selColor;TAGS[ti].bg=selBg;
        renderTags();renderMain();
      };
      inp.onblur=()=>setTimeout(save,150);
      inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();save()}};
      inp.focus();inp.select();
    }
    buildEdit();
  });

  // 이름+색상 수정 (자식)
  w.querySelectorAll('.tag-ie-c').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const ti=parseInt(btn.dataset.ti),ci=parseInt(btn.dataset.ci),c=TAGS[ti].children[ci];
    const row=btn.closest('.tag-item');
    const lbl=row.querySelector('.tag-col-label');
    if(!lbl)return;

    let selColor=c.color,selBg=c.bg;
    function buildEdit(){
      // 하위태그 수정: 이름만 수정 (색상은 상위태그와 동일하므로 팔레트 없음)
      lbl.innerHTML=`<div style="display:flex;align-items:center;gap:4px;width:100%">
        <input class="tag-edit-inp" value="${c.label}" style="border:none;outline:none;background:transparent;font-size:12px;color:var(--tp);font-family:inherit;flex:1;min-width:0">
      </div>`;
      const inp=lbl.querySelector('.tag-edit-inp');
      lbl.querySelectorAll('.tag-pal-pick').forEach(pb=>pb.onclick=ev=>{
        ev.stopPropagation();ev.preventDefault();
        const p=TPAL[parseInt(pb.dataset.i)];
        selColor=p.color;selBg=p.bg;
        buildEdit();
        lbl.querySelector('.tag-edit-inp').focus();
      });
      const save=()=>{
        const nl=inp.value.trim();
        if(nl)TAGS[ti].children[ci].label=nl;
        // 색상은 상위태그 색상 유지 (변경 없음)
        renderTags();renderMain();
      };
      inp.onblur=()=>setTimeout(save,150);
      inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();save()}};
      inp.focus();inp.select();
    }
    buildEdit();
  });

  // 삭제 (부모)
  w.querySelectorAll('.tag-id').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const ti=parseInt(btn.dataset.ti),t=TAGS[ti];
    const allIds=[t.id,...(t.children||[]).map(c=>c.id)];
    const usedCount=entries.filter(e=>e.tags.some(tid=>allIds.includes(tid))).length;
    const usedMsg=usedCount>0?`\n이 태그가 사용된\n일기 ${usedCount}개에서도 제거됩니다.`:'';
    const childMsg=(t.children&&t.children.length>0)?'\n하위태그도 함께 삭제됩니다.':'';
    showConfirm(`"${t.label}" 태그를 삭제할까요?${childMsg}${usedMsg}`,()=>{
      TAGS.splice(ti,1);
      entries.forEach(e=>{e.tags=e.tags.filter(x=>!allIds.includes(x))});
      if(allIds.includes(actTag))actTag=null;
      renderTags();renderMain();
    });
  });

  // 삭제 (자식)
  w.querySelectorAll('.tag-id-c').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const ti=parseInt(btn.dataset.ti),ci=parseInt(btn.dataset.ci),c=TAGS[ti].children[ci];
    const usedCount=entries.filter(e=>e.tags.includes(c.id)).length;
    const usedMsg=usedCount>0?`\n이 태그가 사용된\n일기 ${usedCount}개에서도 제거됩니다.`:'';
    showConfirm(`"${c.label}" 하위태그를 삭제할까요?${usedMsg}`,()=>{
      TAGS[ti].children.splice(ci,1);
      entries.forEach(e=>{e.tags=e.tags.filter(x=>x!==c.id)});
      if(actTag===c.id)actTag=null;
      renderTags();renderMain();
    });
  });

  // 일반 클릭 (편집 모드 아닐 때)
  w.querySelectorAll('.tag-item').forEach(el=>el.onclick=e=>{
    if(tagEditMode||e.target.closest('.tag-expand,.tag-ie,.tag-id,.tag-ie-c,.tag-id-c,.tag-plus-btn'))return;
    actTag=el.dataset.id||null;
    const t=getTag(actTag);
    const lbl=actTag?(t?.label||'전체'):'전체';
    $$('main-title').textContent=lbl;
    $$('mob-hdr-t').textContent=lbl;
    if(isMob())closeSB();
    setView('list');
  });
}

// ── MAIN RENDER ───────────────────────────────
function renderMain(){
  renderStats();
  $$('cnt-lbl').textContent=''+entries.length;
  renderTags();
  if(curView==='list')renderList();else if(curView==='gallery')renderGallery();else renderBC();
}
function filtered(){
  return entries.filter(e=>{
    if(actTag){
      // 상위태그 선택 시 하위태그로 작성된 글도 포함
      const parent=TAGS.find(t=>t.id===actTag);
      const allIds=parent
        ?[actTag,...(parent.children||[]).map(c=>c.id)]
        :[actTag];
      if(!(e.tags||[]).some(tid=>allIds.includes(tid)))return false;
    }
    if(srchQ){const q=srchQ.toLowerCase();if(!e.title.toLowerCase().includes(q)&&!e.body.toLowerCase().includes(q))return false}
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
}function renderList(){
  const w=$$('list-view'),l=filtered();
  if(!l.length){w.innerHTML='<div class="no-entry"><i class="ti ti-notebook"></i><p>일기가 없습니다</p></div>';return}
  w.innerHTML=l.map(e=>'<div class="ecard" data-id="'+e.id+'"><div class="ec-top"><span class="ec-tit">'+(e.title||'(제목 없음)')+'</span><span class="ec-dt">'+fs(e.date)+'</span></div><div class="ec-prev">'+stripHtml(e.body||'')+'</div><div class="ec-tags">'+e.tags.map(tid=>{const t=getTag(tid);const tc=getTagColor(tid);return t?'<span class="ec-tag" style="background:'+tc.bg+';color:'+tc.color+'">'+t.label+'</span>':''}).join('')+'</div></div>').join('');

  let selectMode=false;
  const selected=new Set();

  function enterSelectMode(id){
    selectMode=true;
    selected.clear();
    selected.add(id);
    // 상단에 삭제 바 표시
    let bar=$$('list-sel-bar');
    if(!bar){
      bar=document.createElement('div');
      bar.id='list-sel-bar';
      bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:700;background:var(--ac);color:#fff;display:flex;align-items:center;padding:12px 20px;gap:12px;font-size:14px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.15)';
      bar.innerHTML='<button id="list-sel-cancel" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0;display:flex;align-items:center"><i class="ti ti-x"></i></button>'
        +'<span id="list-sel-cnt" style="flex:1">1개 선택</span>'
        +'<button id="list-sel-del" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0;display:flex;align-items:center"><i class="ti ti-trash"></i></button>';
      document.body.appendChild(bar);
      $$('list-sel-cancel').onclick=exitSelectMode;
      $$('list-sel-del').onclick=async()=>{
        if(!selected.size)return;
        showConfirm(`선택한 일기 ${selected.size}개를 삭제할까요?`,async()=>{
          showLoading(true);
          try{
            await Promise.all([...selected].map(id=>{
              const e=entries.find(x=>x.id===id);
              return e?dbDeleteEntry(e.key):Promise.resolve();
            }));
          }catch(e){alert('삭제 실패: '+e.message);}
          finally{showLoading(false);exitSelectMode();}
        });
      };
    }
    bar.style.display='flex';
    updateSelectBar();
    renderSelectState();
  }

  function exitSelectMode(){
    selectMode=false;
    selected.clear();
    const bar=$$('list-sel-bar');
    if(bar)bar.style.display='none';
    w.querySelectorAll('.ecard').forEach(el=>el.classList.remove('ecard-sel'));
  }

  function updateSelectBar(){
    const cnt=$$('list-sel-cnt');
    if(cnt)cnt.textContent=`${selected.size}개 선택`;
  }

  function renderSelectState(){
    w.querySelectorAll('.ecard').forEach(el=>{
      el.classList.toggle('ecard-sel',selected.has(el.dataset.id));
    });
  }

  w.querySelectorAll('.ecard').forEach(el=>{
    let pressTimer=null;

    el.addEventListener('touchstart',()=>{
      pressTimer=setTimeout(()=>{
        if(!selectMode)enterSelectMode(el.dataset.id);
        else{
          selected.has(el.dataset.id)?selected.delete(el.dataset.id):selected.add(el.dataset.id);
          updateSelectBar();renderSelectState();
        }
      },500);
    },{passive:true});
    el.addEventListener('touchend',()=>clearTimeout(pressTimer));
    el.addEventListener('touchmove',()=>clearTimeout(pressTimer));

    el.onclick=()=>{
      if(selectMode){
        selected.has(el.dataset.id)?selected.delete(el.dataset.id):selected.add(el.dataset.id);
        updateSelectBar();renderSelectState();
        if(selected.size===0)exitSelectMode();
        return;
      }
      const e=entries.find(x=>x.id==el.dataset.id);if(e)openRead(e);
    };
  });
}
let galleryTag=null; // 갤러리 필터 태그

function renderGallery(){
  const scroll=$$('gallery-scroll');
  if(!scroll)return;

  // 필터 바 태그명 업데이트
  const filterLbl=$$('gallery-filter-tag');
  if(filterLbl){
    if(galleryTag){
      const t=getTag(galleryTag);
      filterLbl.textContent=t?t.label:'전체';
      filterLbl.style.color='var(--ac)';
    } else {
      filterLbl.textContent='전체';
      filterLbl.style.color='var(--ts)';
    }
  }

  // 태그 필터링 (상위+하위 포함)
  let filtered=entries;
  if(galleryTag){
    const parent=TAGS.find(t=>t.id===galleryTag);
    const allIds=parent?[galleryTag,...(parent.children||[]).map(c=>c.id)]:[galleryTag];
    filtered=entries.filter(e=>(e.tags||[]).some(tid=>allIds.includes(tid)));
  }

  // 날짜순 이미지 수집
  const imgs=[];
  [...filtered].sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{
    (e.media||[]).forEach(m=>{if(m.type==='image')imgs.push({src:m.src,entry:e});});
    if(e.body){
      const tmp=document.createElement('div');tmp.innerHTML=e.body;
      tmp.querySelectorAll('img').forEach(img=>imgs.push({src:img.src,entry:e}));
    }
  });

  if(!imgs.length){
    scroll.innerHTML='<div class="no-entry" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--ts);gap:10px"><i class="ti ti-photo-off" style="font-size:40px;opacity:.2"></i><p>사진이 없습니다</p></div>';
    return;
  }

  scroll.innerHTML='<div id="gallery-grid"></div>';
  const grid=$$('gallery-grid');
  imgs.forEach(({src,entry})=>{
    if(!src||src.startsWith('blob:'))return;
    const cell=document.createElement('div');
    cell.className='gallery-cell';
    cell.style.backgroundImage=`url(${src})`;
    cell.onclick=()=>openRead(entry);
    grid.appendChild(cell);
  });
}

function renderBC(){
  $$('bc-lbl-txt').textContent=bcD.getFullYear()+'년 '+(bcD.getMonth()+1)+'월';
  const g=$$('bc-grid');
  const dn=['일','월','화','수','목','금','토'];
  let h=dn.map(d=>'<div class="bc-dn">'+d+'</div>').join('');
  const f=new Date(bcD.getFullYear(),bcD.getMonth(),1);
  const l=new Date(bcD.getFullYear(),bcD.getMonth()+1,0);
  const dw=f.getDay(),tot=Math.ceil((dw+l.getDate())/7)*7+7;
  for(let i=0;i<tot;i++){
    const dd=new Date(f);dd.setDate(dd.getDate()-dw+i);
    const isO=dd.getMonth()!==bcD.getMonth(),ds=fd(dd),it=ds===tds();
    // 항상 전체 일기 표시 (태그 필터 무시)
    const de=entries.filter(e=>e.date===ds);
    // 태그 색상 도트 수집 (중복 제거)
    const tagColors=[];
    de.forEach(e=>e.tags.forEach(tid=>{
      const t=getTag(tid);
      const tc=getTagColor(tid);
      if(t&&!tagColors.find(c=>c.color===tc.color))tagColors.push({color:tc.color,bg:tc.bg});
    }));
    let dotsHtml='';
    if(tagColors.length>0){
      const show=tagColors.slice(0,3);
      const extra=tagColors.length-3;
      dotsHtml='<div class="bc-dots">'
        +show.map(c=>'<span class="bc-dot" style="background:'+c.color+'"></span>').join('')
        +(extra>0?'<span class="bc-dot-plus">+</span>':'')
        +'</div>';
    }
    const hd=getH(ds),hdh=hd?'<div class="hd-lbl">'+hd+'</div>':'';
    h+='<div class="bc-cell'+(it?' today':'')+(isO?' otm':'')+(hd?' hday':'')+'" data-ds="'+ds+'">'
      +'<div class="bc-num">'+dd.getDate()+'</div>'+hdh+dotsHtml+'</div>';
  }
  g.innerHTML=h;
  g.querySelectorAll('.bc-cell[data-ds]').forEach(el=>el.onclick=()=>{
    const ds=el.dataset.ds;
    const de=entries.filter(e=>e.date===ds);
    if(de.length===0)openEd('new',{date:ds});
    else openDayList(ds,de);
  });
}

let readEnt=null;

  $$('read-date').textContent=new Date(entry.date+'T00:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  // 태그
  const tw=$$('read-tags');
  tw.innerHTML=entry.tags.map(tid=>{const t=getTag(tid);const tc=getTagColor(tid);return t?'<span class="ec-tag" style="background:'+tc.bg+';color:'+tc.color+'">'+t.label+'</span>':''}).join('');
  const bw=$$('read-body');
  bw.innerHTML='';
  if(entry.media&&entry.media.length){
    entry.media.forEach(m=>{
      if(m.type==='image'){const img=document.createElement('img');img.src=m.src;img.alt='사진';img.style.cssText='max-width:100%;border-radius:var(--rl);margin:8px 0;display:block';bw.appendChild(img);}
      else if(m.type==='video'){const vid=document.createElement('video');vid.src=m.src;vid.controls=true;vid.style.cssText='max-width:100%;border-radius:var(--rl);margin:8px 0;display:block';bw.appendChild(vid);}
      else if(m.type==='youtube'){
        const yw=document.createElement('div');yw.className='yt-block';
        yw.innerHTML=`<div class="yt-wrap"><iframe src="https://www.youtube.com/embed/${m.ytId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
        bw.appendChild(yw);
      }
      else if(m.type==='link'){
        const a=document.createElement('a');a.className='lp';a.href=m.url;a.target='_blank';
        const dom=m.domain||(()=>{try{return new URL(m.url).hostname}catch{return m.url}})();
        a.innerHTML=
          (m.image?`<img class="lp-img" src="${m.image}" alt="" onerror="this.style.display='none'">` :'')
          +`<div class="lp-body">`
          +`<div class="lp-dom"><i class="ti ti-link" style="font-size:10px;margin-right:3px"></i>${dom}</div>`
          +`<div class="lp-tit">${m.title||dom}</div>`
          +(m.description?`<div class="lp-desc">${m.description}</div>`:'')
          +`<div class="lp-url">${m.url}</div>`
          +`</div>`;
        bw.appendChild(a);
      }
    });
  }
  // 텍스트 본문 (HTML 렌더링)
  const p=document.createElement('div');
  p.className='tiptap-read-body';
  if(entry.body){
    const b=entry.body;
    // HTML 엔티티 디코딩 후 판단 (RTDB에서 이스케이프되어 올 수 있음)
    const temp=document.createElement('div');
    temp.innerHTML=b;
    const decoded=temp.innerHTML;
    // <div>, <p>, <b>, <i>, <h1>, <ul> 등 HTML 태그 포함 여부로 판단
    const hasHtml=/<\/?[a-zA-Z][^>]*>/.test(b);
    if(hasHtml){
      p.innerHTML=b;
    } else {
      p.style.whiteSpace='pre-wrap';
      p.textContent=b;
    }
  }
  bw.appendChild(p);
  // 제목/본문 클릭 → 편집 모드
  $$('read-title').style.cursor='pointer';
  $$('read-body').style.cursor='pointer';
  $$('read-title').onclick=()=>openEd('edit',readEnt);
  $$('read-body').onclick=()=>openEd('edit',readEnt);
  showV('read');
}

  if(entry?.media)entry.media.forEach(m=>insertM(m,false));

}
async function saveEd(){
  const title=$$('e-title').value.trim(),date=$$('e-date').value;
  const cont=$$('ed-content');
  const body=cont?cont.innerHTML:'';
  const media=edEnt?.media||[];
  if(!title&&(!body||body==='<br>'||body===''))return;
  showLoading(true);
  try{
    if(edMode==='new'){
      await dbAddEntry({title,date,tags:edTags,body,media});
      readEnt=null;showV(curView);renderMain();
    } else {
      await dbUpdateEntry(edEnt.key,{title,date,tags:edTags,body,media});
      closeEd();
    }
  }catch(e){alert('저장 실패: '+e.message);}
  finally{showLoading(false);}
}function closeEd(){
  if(edMode==='edit'&&readEnt){
    const updated=entries.find(e=>e.id===readEnt.id);
    if(updated){openRead(updated);return;}
  }
  // 새 글 저장 후 day-list에서 왔으면 갱신
  if(dayListDate){
    const de=entries.filter(e=>e.date===dayListDate);
    if(de.length>1){openDayList(dayListDate,de);return;}
    if(de.length===1){dayListDate=null;openRead(de[0]);return;}
  }
  showV(curView);
  $$('mob-hdr-t').textContent=actTag?(getTag(actTag)?.label||'전체'):'전체';
  renderMain();
}
function renderATags(){
  const w=$$('atag-wrap');
  w.querySelectorAll('.a-tag').forEach(el=>el.remove());

  edTags.forEach(tid=>{const t=getTag(tid);if(!t)return;const tc=getTagColor(tid);const s=document.createElement('span');s.className='a-tag';s.style.cssText='background:'+tc.bg+';color:'+tc.color;s.textContent=t.label;s.title='클릭하여 제거';s.onclick=()=>{edTags=edTags.filter(x=>x!==tid);renderATags()};w.insertBefore(s,btn)});

function insertM(obj,add=true){
  const body=$$('ed-body'),cont=$$('ed-content');
  if(obj.type==='link'){insertLP(obj.url,obj.title,false);return;}
  if(obj.type==='youtube'){insertYoutube(obj.ytId, add);return;}
  const bl=document.createElement('div');bl.className='m-block';
  if(obj.type==='image'){const img=document.createElement('img');img.src=obj.src;img.alt='사진';bl.appendChild(img);}

  if(add&&edEnt)edEnt.media.push(obj);
}

// 파일/붙여넣기 이미지 → Storage 업로드 후 insertM


function getYoutubeId(url){
  try{
    const u=new URL(url);
    // youtu.be/ID
    if(u.hostname==='youtu.be')return u.pathname.slice(1).split('?')[0];
    if(u.hostname.includes('youtube.com')){
      // watch?v=ID
      const v=u.searchParams.get('v');
      if(v)return v;
      // /shorts/ID
      const shorts=u.pathname.match(/\/shorts\/([^/?]+)/);
      if(shorts)return shorts[1];
      // /live/ID
      const live=u.pathname.match(/\/live\/([^/?]+)/);
      if(live)return live[1];
    }
  }catch(e){}
  return null;
}

function insertYoutube(ytId, add=true){
  const body=$$('ed-body'),cont=$$('ed-content');
  if(!body)return;
  // 중복 삽입 방지
  if(body.querySelector('[data-ytid="'+ytId+'"]'))return;
  const wrap=document.createElement('div');
  wrap.className='yt-block';
  wrap.dataset.ytid=ytId;
  wrap.innerHTML=`
    <div class="yt-wrap">
      <iframe src="https://www.youtube.com/embed/${ytId}"
        frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </div>`;
  const rm=document.createElement('button');rm.className='m-rm';rm.innerHTML='<i class="ti ti-x"></i>';rm.title='삭제';
  rm.onclick=()=>{
    if(edEnt)edEnt.media=edEnt.media.filter(m=>m.ytId!==ytId);
    wrap.remove();
  };
  wrap.appendChild(rm);
  body.insertBefore(wrap,cont);
  if(add&&edEnt){
    if(!edEnt.media)edEnt.media=[];
    edEnt.media.push({type:'youtube',ytId});
  }
}


async function insertLP(url,title,add=true){
  const body=$$('ed-body'),cont=$$('ed-content');
  // 중복 삽입 방지
  if(body&&body.querySelector(`.lp[data-url="${CSS.escape(url)}"]`))return;

  let dom=url;try{dom=new URL(url).hostname}catch{}

  const div=document.createElement('div');
  div.className='lp';div.dataset.url=url;
  div.innerHTML=`
    <div class="lp-loading">
      <span class="lp-dot"></span><span class="lp-dot"></span><span class="lp-dot"></span>
    </div>`;
  const rm=document.createElement('button');rm.className='lp-rm';rm.innerHTML='<i class="ti ti-x"></i>';rm.title='삭제';
  rm.onclick=e=>{e.stopPropagation();if(edEnt)edEnt.media=edEnt.media.filter(m=>m.url!==url);div.remove()};
  div.prepend(rm);

  // ed-body 안 ed-content 앞에 삽입 (contenteditable 밖)
  body.insertBefore(div, cont);

  // Microlink API 호출
  let meta={title:title||dom,description:'',image:'',domain:dom};
  try{
    const res=await fetch('https://api.microlink.io/?url='+encodeURIComponent(url));
    if(res.ok){
      const data=await res.json();
      if(data.status==='success'){
        meta.title=data.data.title||meta.title;
        meta.description=data.data.description||'';
        meta.image=data.data.image?.url||'';
        meta.domain=data.data.publisher||dom;
      }
    }
  }catch(e){}

  // 카드 렌더링
  div.innerHTML=`
    ${meta.image?`<img class="lp-img" src="${meta.image}" alt="" onerror="this.style.display='none'">` :''}
    <div class="lp-body">
      <div class="lp-dom"><i class="ti ti-link" style="font-size:10px;margin-right:3px"></i>${meta.domain}</div>
      <div class="lp-tit">${meta.title}</div>
      ${meta.description?`<div class="lp-desc">${meta.description}</div>`:''}
      <div class="lp-url">${url}</div>
    </div>`;
  div.prepend(rm);
  div.onclick=e=>{if(e.target!==rm&&!rm.contains(e.target))window.open(url,'_blank')};

  if(add&&edEnt){
    if(!edEnt.media)edEnt.media=[];
    edEnt.media.push({type:'link',url,title:meta.title,description:meta.description,image:meta.image,domain:meta.domain});
  }
}

// ── 에디터 툴바 ──────────────────────────────
function bindTiptapToolbar(){
  const ec=$$('ed-content');
  if(!ec)return;

  function updateState(){
    try{
      ['bold','italic','underline','strikeThrough'].forEach((cmd,i)=>{
        const b=[$$('ed-bold'),$$('ed-ital'),$$('ed-under'),$$('ed-strike')][i];
        if(b)b.classList.toggle('fmt-on',document.queryCommandState(cmd));
      });
      const sel=window.getSelection();
      const node=sel&&sel.rangeCount?sel.anchorNode:null;
      const el=node?(node.nodeType===3?node.parentElement:node):null;
      [['ed-h1','h1'],['ed-h2','h2'],['ed-ul','ul'],['ed-ol','ol'],['ed-quote','blockquote']].forEach(([id,tag])=>{
        const b=$$(id);if(b)b.classList.toggle('fmt-on',!!(el&&el.closest(tag)));
      });
    }catch(e){}
  }

  document.addEventListener('selectionchange',()=>{
    if(document.activeElement===ec||ec.contains(document.activeElement))updateState();
  });

  const _tbRow=$$('ed-toolbar-row');
  if(_tbRow)_tbRow.querySelectorAll('button').forEach(btn=>btn.addEventListener('mousedown',e=>e.preventDefault()));

  const run=cmd=>()=>{document.execCommand(cmd);ec.focus();updateState();};
  $$('ed-bold')&&($$('ed-bold').onclick=run('bold'));
  $$('ed-ital')&&($$('ed-ital').onclick=run('italic'));
  $$('ed-under')&&($$('ed-under').onclick=run('underline'));
  $$('ed-strike')&&($$('ed-strike').onclick=run('strikeThrough'));
  $$('ed-ul')&&($$('ed-ul').onclick=run('insertUnorderedList'));
  $$('ed-ol')&&($$('ed-ol').onclick=run('insertOrderedList'));
  $$('ed-h1')&&($$('ed-h1').onclick=()=>{document.execCommand('formatBlock',false,'<h1>');ec.focus();updateState();});
  $$('ed-h2')&&($$('ed-h2').onclick=()=>{document.execCommand('formatBlock',false,'<h2>');ec.focus();updateState();});

  $$('ed-quote')&&($$('ed-quote').onclick=()=>{
    const sel=window.getSelection();
    const node=sel&&sel.anchorNode;
    const el=node?(node.nodeType===3?node.parentElement:node):null;
    const bq=el&&el.closest('blockquote');
    if(bq){const p=bq.parentNode;while(bq.firstChild)p.insertBefore(bq.firstChild,bq);p.removeChild(bq);}
    else document.execCommand('formatBlock',false,'<blockquote>');
    ec.focus();updateState();
  });

  let _ee=false;
  ec.addEventListener('keydown',e=>{
    if(e.key!=='Enter'){_ee=false;return;}
    const sel=window.getSelection();
    const node=sel&&sel.anchorNode;
    const el=node?(node.nodeType===3?node.parentElement:node):null;
    if(!el||!el.closest('blockquote')){_ee=false;return;}
    const isEmpty=el.textContent.trim()==='';
    if(isEmpty&&_ee){
      e.preventDefault();
      const bq=el.closest('blockquote');
      const last=bq.lastElementChild;
      if(last&&last.textContent.trim()==='')last.remove();
      const d=document.createElement('div');d.innerHTML='<br>';
      bq.parentNode.insertBefore(d,bq.nextSibling);
      const r=document.createRange();r.setStart(d,0);r.collapse(true);
      sel.removeAllRanges();sel.addRange(r);_ee=false;
    } else {_ee=isEmpty;}
  });

  $$('ed-undo')&&($$('ed-undo').onclick=()=>{document.execCommand('undo');ec.focus();});
  $$('ed-redo')&&($$('ed-redo').onclick=()=>{document.execCommand('redo');ec.focus();});

  $$('ed-toolbar-row').querySelectorAll('.col-sw').forEach(b=>{
    b.onclick=()=>{
      $$('ed-toolbar-row').querySelectorAll('.col-sw').forEach(x=>{x.classList.remove('on');x.style.outline='';});
      b.classList.add('on');b.style.outline='2px solid var(--ac)';
      b.dataset.c==='default'?document.execCommand('removeFormat'):document.execCommand('foreColor',false,b.dataset.c);
      ec.focus();
    };
  });

  $$('link-cancel').onclick=()=>$$('m-link').classList.remove('show');
  $$('link-ok').onclick=()=>{
    const u=$$('link-url').value.trim();
    if(u)document.execCommand('createLink',false,u);
    $$('m-link').classList.remove('show');
  };
  $$('link-url').onkeydown=e=>{if(e.key==='Enter')$$('link-ok').click();};
  $$('m-link').onclick=e=>{if(e.target===e.currentTarget)$$('m-link').classList.remove('show');};

  ec.addEventListener('paste',e=>{
    // 이미지 붙여넣기
    const items=e.clipboardData?.items;
    if(items){
      for(const item of items){
        if(item.type.startsWith('image/')){
          e.preventDefault();
          const file=item.getAsFile();
          if(!file)continue;
          (async()=>{
            showLoading(true);
            try{
              const url=await uploadImage(file);
              insertM({type:'image',src:url});
            }catch(err){alert('업로드 실패: '+err.message);}
            finally{showLoading(false);}
          })();
          return;
        }
      }
    }
    // 항상 plain text로만 처리 (서식 제거)
    e.preventDefault();
    const t=(e.clipboardData||window.clipboardData)?.getData('text/plain')?.trim();
    if(!t)return;
    if(isURL(t)){
      // 유튜브 URL이면 영상 임베딩
      const ytId=getYoutubeId(t);
      if(ytId){
        insertYoutube(ytId);
      } else {
        insertLP(t,'',true);
      }
    } else {
      // 일반 텍스트: 서식 없이 그대로 삽입
      document.execCommand('insertText',false,t);
    }
  });
}

function openTagModal(){
  const pl=$$('tp-parent-list');
  const cl=$$('tp-child-list');
  const cs=$$('tp-child-section');
  const clbl=$$('tp-child-label');
  let openParentId=null;

  function render(){
    // 부모 렌더
    pl.innerHTML=TAGS.map(t=>{
      const tc=getTagColor(t.id);
      const childSel=t.children&&t.children.some(c=>edTags.includes(c.id));
      const on=edTags.includes(t.id)||childSel;
      return `<button class="tp-btn${on?' on':''}" data-id="${t.id}" style="${on?'background:'+tc.bg+';color:'+tc.color+';border-color:'+tc.color+';':''}">${t.label}</button>`;
    }).join('');

    // 자식 렌더
    const openParent=openParentId?TAGS.find(t=>t.id===openParentId):null;
    if(openParent&&openParent.children&&openParent.children.length>0){
      clbl.textContent=openParent.label+' › 하위태그 선택';
      cl.innerHTML=openParent.children.map(c=>{
        const tc=getTagColor(c.id);
        const on=edTags.includes(c.id);
        return `<button class="tp-btn${on?' on':''}" data-id="${c.id}" data-parent="${openParentId}" style="${on?'background:'+tc.bg+';color:'+tc.color+';border-color:'+tc.color+';':''}">${c.label}</button>`;
      }).join('');
      cs.style.display='block';
    } else {
      cs.style.display='none';
      cl.innerHTML='';
    }
  }

  // 이벤트 위임 — 부모
  pl.onclick=e=>{
    const btn=e.target.closest('.tp-btn');
    if(!btn)return;
    const tid=btn.getAttribute('data-id');
    if(!tid)return;
    const t=TAGS.find(x=>x.id===tid);
    if(!t)return;
    const childSel=t.children&&t.children.some(c=>edTags.includes(c.id));
    const directSel=edTags.includes(tid);
    if(directSel||childSel){
      edTags=edTags.filter(x=>x!==tid);
      if(t.children)t.children.forEach(c=>{edTags=edTags.filter(x=>x!==c.id)});
      openParentId=null;
    } else {
      edTags.push(tid);
      openParentId=t.children&&t.children.length>0?tid:null;
    }
    render();
  };

  // 이벤트 위임 — 자식
  cl.onclick=e=>{
    const btn=e.target.closest('.tp-btn');
    if(!btn)return;
    const cid=btn.getAttribute('data-id');
    const pid=btn.getAttribute('data-parent');
    if(!cid||!pid)return;
    if(edTags.includes(cid)){
      edTags=edTags.filter(x=>x!==cid);
    } else {
      edTags=edTags.filter(x=>x!==pid); // 상위 제거
      edTags.push(cid);
    }
    render();
  };

  // 초기 openParent 설정
  for(const t of TAGS){
    if(t.children&&t.children.some(c=>edTags.includes(c.id))){
      openParentId=t.id;break;
    }
    if(edTags.includes(t.id)&&t.children&&t.children.length>0){
      openParentId=t.id;break;
    }
  }

  render();
  $$('m-tag').classList.add('show');
}

const MN=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
function makeP(pickerEl,ylEl,msEl,getD,setD,onPick){
  let py=getD().getFullYear();
  function renderP(){
    const cur=getD();ylEl.textContent=py+'년';
    msEl.innerHTML=MN.map((n,i)=>{const on=py===cur.getFullYear()&&i===cur.getMonth();const ym=py+'-'+String(i+1).padStart(2,'0');const he=entries.some(e=>e.date.startsWith(ym));return'<button class="ym-mb'+(on?' on':'')+(he&&!on?' he':'')+'" data-m="'+i+'">'+n+'</button>'}).join('');
    msEl.querySelectorAll('.ym-mb').forEach(b=>b.onclick=()=>{setD(py,parseInt(b.dataset.m));closeP();onPick()});
  }
  function openP(){py=getD().getFullYear();renderP();pickerEl.classList.add('open')}
  function closeP(){pickerEl.classList.remove('open')}
  function toggleP(){pickerEl.classList.contains('open')?closeP():openP()}
  // year nav buttons (first two .ym-ynav inside this picker)
  const ynavs=pickerEl.querySelectorAll('.ym-ynav');
  ynavs[0].onclick=()=>{py--;renderP()};
  ynavs[1].onclick=()=>{py++;renderP()};
  return{open:openP,close:closeP,toggle:toggleP};
}
